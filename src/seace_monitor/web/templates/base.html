<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ nombre }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="barra">
  <a class="marca" href="/">{{ nombre }}</a>
  {% if sesion %}
  <form method="post" action="/salir" class="salir">
    <input type="hidden" name="csrf" value="{{ sesion.csrf }}">
    <button type="submit" class="enlace">Salir</button>
  </form>
  {% endif %}
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
