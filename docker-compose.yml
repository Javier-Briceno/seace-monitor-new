services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # the search tool reads it at any hour, so it comes back after a reboot
    restart: unless-stopped
    healthcheck:
      # Over TCP: while schema.sql loads, Postgres runs a temporary server on the
      # unix socket only, which would otherwise already count as healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  # Only needed outside Peru: SEACE blocks foreign IPs. Starts with --profile vpn
  # and exposes an HTTP proxy; set [network] proxy in config.toml to use it.
  vpn:
    image: qmcgaw/gluetun:v3
    profiles: [vpn]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-nordvpn}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      SERVER_COUNTRIES: ${VPN_COUNTRY:-Peru}
      HTTPPROXY: "on"
    ports:
      - "127.0.0.1:${VPN_PROXY_PORT:-8888}:8888"
    volumes:
      # Server list, refreshed with: docker compose run --rm vpn update -enduser -providers nordvpn
      - gluetun:/gluetun

  # The monitor itself, for a server: docker compose --profile monitor run --rm monitor --avisos
  # It reaches Postgres as db and the VPN proxy as vpn:8888 (set proxy = "http://vpn:8888" in config.toml).
  monitor:
    build: .
    profiles: [monitor]
    env_file: .env
    # OCR takes every core; under load the other services of the machine come first
    cpu_shares: 512
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data

  # The search tool: docker compose --profile web up -d web. A reverse proxy with HTTPS forwards to
  # 127.0.0.1:${WEB_PORT}; the app reads [web] in config.toml and the same documents, read-only.
  web:
    build: .
    profiles: [web]
    env_file: .env
    entrypoint: ["uvicorn", "--factory", "seace_monitor.web.app:default_app", "--host", "0.0.0.0", "--port", "8000",
                 "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8091}:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  pgdata:
  gluetun:
